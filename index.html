<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Fuel Journey Capture</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="container">

    <h2>Fuel Journey Capture</h2>

    <!-- ========================= -->
    <!-- JOURNEY TYPE -->
    <!-- ========================= -->

    <div class="stage-buttons">

      <button
        class="stage-btn"
        onclick="setStage('start')"
      >
        START
      </button>

      <button
        class="stage-btn"
        onclick="setStage('reach')"
      >
        REACH
      </button>

      <button
        class="stage-btn"
        onclick="setStage('return')"
      >
        RETURN
      </button>

    </div>

    <!-- ========================= -->
    <!-- CAMERA -->
    <!-- ========================= -->

    <video
      id="video"
      autoplay
      playsinline
      muted
    ></video>

    <img
      id="capturedPhoto"
      style="display:none;"
    >

    <canvas
      id="canvas"
      style="display:none;"
    ></canvas>

    <!-- ========================= -->
    <!-- ACTION BUTTONS -->
    <!-- ========================= -->

    <div id="kmContainer">

      <input
        type="number"
        id="kmInput"
        placeholder="Enter KM Reading"
      >

    </div>

    <button
      id="cameraBtn"
      onclick="startCamera()"
    >
      Open Camera
    </button>

    <button
      id="locationBtn"
      onclick="getLocation()"
    >
      Get Location
    </button>

    <button
      id="uploadBtn"
      onclick="captureAndUpload()"
    >
      Capture & Upload
    </button>

    <!-- ========================= -->
    <!-- STATUS -->
    <!-- ========================= -->

    <div id="stageInfo"></div>

    <p id="status">
      Loading...
    </p>

    <!-- ========================= -->
    <!-- RESULT -->
    <!-- ========================= -->

    <div id="result"></div>

  </div>

  <script src="script.js"></script>

</body>

</html>
